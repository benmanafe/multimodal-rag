<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document Q&amp;A</title>
<style>
  :root {
    --bg:#f3f4f8; --side:#ebedf4; --panel:#ffffff; --text:#1b2030; --muted:#6b7385; --border:#e0e3ec;
    --accent:#4f46e5; --user:linear-gradient(135deg,#4f46e5,#7c3aed); --bot:#f0f2f8;
    --chip:#eef0ff; --chip-text:#4338ca; --hover:rgba(80,90,140,.10); --active:rgba(79,70,229,.14);
    --err-bg:#fff0f0; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1017; --side:#12141d; --panel:#171a24; --text:#e8eaf2; --muted:#8f97ab; --border:#272c3a;
      --accent:#818cf8; --user:linear-gradient(135deg,#6366f1,#8b5cf6); --bot:#20243a;
      --chip:#262b4a; --chip-text:#b4bbff; --hover:rgba(160,170,255,.09); --active:rgba(129,140,248,.18);
      --err-bg:#2c1a1d; --err:#ff8f8f;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  [hidden] { display:none !important; }

  .app { display:flex; height:100dvh; width:100%; }

  /* ---------- sidebar ---------- */
  aside { width:290px; flex:none; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:transform .22s ease; }
  .brand { display:flex; align-items:center; gap:10px; padding:16px 16px 10px; font-weight:650; }
  .logo { width:34px; height:34px; border-radius:10px; background:var(--user); display:grid; place-items:center; color:#fff; flex:none; }
  .new { margin:6px 12px 12px; padding:10px 12px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; cursor:pointer; font-weight:550; transition:.15s; }
  .new:hover { border-color:var(--accent); }
  .label { padding:6px 18px; font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  #sessions { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .session { display:flex; align-items:center; gap:4px; border-radius:10px; margin-bottom:2px; }
  .session:hover { background:var(--hover); }
  .session.active { background:var(--active); }
  .session .title { flex:1; min-width:0; background:none; border:0; text-align:left; padding:9px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session .del { opacity:0; width:28px; height:28px; margin-right:4px; border:0; border-radius:8px; background:none; color:var(--muted); cursor:pointer; flex:none; }
  .session:hover .del, .session .del:focus-visible { opacity:1; }
  .session .del:hover { background:var(--hover); color:var(--err); }
  .empty-list { padding:8px 12px; color:var(--muted); font-size:.85rem; }
  .side-foot { padding:12px 16px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-size:.8rem; color:var(--muted); }
  .side-foot a { color:var(--muted); text-decoration:none; } .side-foot a:hover { color:var(--text); }
  .status { display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#9aa1b2; } .dot.ok { background:#22c55e; } .dot.bad { background:#ef4444; }

  /* ---------- main ---------- */
  main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel); }
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--border); min-height:56px; }
  #menu { display:none; width:36px; height:36px; border:0; border-radius:10px; background:none; cursor:pointer; place-items:center; }
  #menu:hover { background:var(--hover); }
  #topic { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #chat { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .col { width:100%; max-width:860px; margin:0 auto; padding:24px 20px 12px; display:flex; flex-direction:column; gap:16px; min-height:100%; }

  .msg { display:flex; gap:10px; max-width:90%; animation:in .22s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation:none; } * { scroll-behavior:auto !important; } }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .avatar { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:.7rem; font-weight:700; background:var(--bot); color:var(--accent); }
  .msg.user .avatar { display:none; }
  .bubble { padding:10px 14px; border-radius:16px; overflow-wrap:anywhere; }
  .msg.bot .bubble { background:var(--bot); border-top-left-radius:4px; }
  .msg.user .bubble { background:var(--user); color:#fff; border-top-right-radius:4px; white-space:pre-wrap; }
  .msg.error .bubble { background:var(--err-bg); color:var(--err); }
  .bubble p { margin:0 0 .6em; } .bubble p:last-child { margin-bottom:0; }
  .bubble ul, .bubble ol { margin:.3em 0 .6em; padding-left:1.3em; }
  .bubble code { background:rgba(127,127,160,.2); padding:1px 5px; border-radius:5px; font-size:.9em; }
  .note { align-self:center; font-size:.8rem; color:var(--muted); background:var(--bot); padding:5px 12px; border-radius:999px; }

  .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .src-label { width:100%; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .chip { display:inline-flex; gap:6px; font-size:.76rem; background:var(--chip); color:var(--chip-text); padding:3px 10px; border-radius:999px; }
  .chip b { font-weight:600; opacity:.75; }

  .typing { display:flex; gap:4px; padding:6px 2px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:b 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes b { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-5px); opacity:1; } }

  .welcome { margin:auto; text-align:center; padding:20px; max-width:480px; }
  .welcome .logo { margin:0 auto 14px; width:56px; height:56px; border-radius:16px; }
  .welcome h2 { margin:0 0 6px; font-size:1.3rem; }
  .welcome p { margin:0 0 18px; color:var(--muted); }
  .suggest { display:flex; flex-direction:column; gap:8px; }
  .suggest button { text-align:left; padding:10px 14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; cursor:pointer; transition:.15s; }
  .suggest button:hover { border-color:var(--accent); transform:translateY(-1px); }

  .composer { padding:8px 20px 6px; }
  form { width:100%; max-width:860px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; }
  .field { flex:1; display:flex; align-items:flex-end; gap:4px; background:var(--bot); border:1px solid transparent; border-radius:18px; padding:4px 6px 4px 4px; }
  .field:focus-within { border-color:var(--accent); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:inherit; padding:9px 6px; max-height:160px; }
  textarea::placeholder { color:var(--muted); }
  .icon-btn { width:36px; height:36px; border:0; border-radius:12px; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; flex:none; }
  .icon-btn:hover:not(:disabled) { background:var(--hover); color:var(--text); }
  .send { width:44px; height:44px; border:0; border-radius:14px; background:var(--user); color:#fff; cursor:pointer; display:grid; place-items:center; flex:none; transition:.15s; }
  .send:hover:not(:disabled) { transform:scale(1.05); }
  .hint { text-align:center; font-size:.72rem; color:var(--muted); padding:4px 14px 10px; }

  /* ---------- mobile: sidebar slides over the chat ---------- */
  .scrim { display:none; }
  @media (max-width:820px) {
    aside { position:fixed; z-index:20; inset:0 auto 0 0; transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.3); }
    .app.open aside { transform:none; }
    .app.open .scrim { display:block; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.4); }
    #menu { display:grid; }
    .msg { max-width:96%; }
    .col { padding:16px 12px 8px; } .composer { padding:8px 12px 4px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside aria-label="Chat sessions">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div>
      <span>RAG Document Q&amp;A</span>
    </div>
    <button class="new" id="new-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="label">Chats</div>
    <div id="sessions"></div>
    <div class="side-foot">
      <span class="status"><span class="dot" id="dot"></span><span id="status-text">Checking…</span></span>
      <a href="/docs" target="_blank" rel="noopener">API docs</a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="topbar">
      <button id="menu" aria-label="Open chat list">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="topic">New chat</div>
    </div>

    <div id="chat" aria-live="polite"><div class="col" id="col"></div></div>

    <div class="composer">
      <form id="form">
        <input type="file" id="file" accept=".txt,.md,.pdf" hidden>
        <div class="field">
          <button type="button" class="icon-btn" id="attach" title="Attach a document" aria-label="Attach a document">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Ask about your documents…" aria-label="Message"></textarea>
        </div>
        <button type="submit" class="send" id="send" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-8-4 16-3-7z"/></svg>
        </button>
      </form>
      <div class="hint">Enter to send · Shift+Enter for a new line · follow-up questions remember this chat</div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), col = $("col"), input = $("input"), send = $("send"), fileInput = $("file");
const SUGGESTIONS = ["What is retrieval-augmented generation?", "Why does chunk size matter?", "Summarize the documents I've uploaded"];
const STORE_KEY = "rag.sessions.v1", ACTIVE_KEY = "rag.active.v1";

/* ---------- state: sessions live in this browser only ---------- */
// session = { id, title, updated, messages: [{ role: "user"|"bot"|"error"|"note", content, sources? }] }
let sessions = [], activeId = null, busy = false;

function load() {
  try { sessions = JSON.parse(localStorage.getItem(STORE_KEY)) || []; activeId = localStorage.getItem(ACTIVE_KEY); } catch { sessions = []; }
  if (!Array.isArray(sessions)) sessions = [];
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); localStorage.setItem(ACTIVE_KEY, activeId || ""); } catch { /* private mode / full: chat still works, just not saved */ }
}
const active = () => sessions.find(s => s.id === activeId);

function newSession() {
  const s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "New chat", updated: Date.now(), messages: [] };
  sessions.unshift(s); activeId = s.id; save(); return s;
}
function openSession(id) {
  if (busy) return;
  activeId = id; save(); render(); closeSidebar();
}
function deleteSession(id) {
  if (busy) return;
  const s = sessions.find(x => x.id === id);
  if (!confirm(`Delete "${s.title}"?`)) return;
  sessions = sessions.filter(x => x.id !== id);
  if (activeId === id) activeId = sessions[0]?.id || null;
  save(); render();
}

/* ---------- rendering ---------- */
function renderMarkdown(text) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const html = []; let list = null;
  const close = () => { if (list) { html.push(`</${list}>`); list = null; } };
  for (const line of text.split("\n")) {
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { close(); html.push(`<${tag}>`); list = tag; }
      html.push(`<li>${inline((ul || ol)[1])}</li>`);
    } else if (line.trim()) { close(); html.push(`<p>${inline(line)}</p>`); }
    else close();
  }
  close(); return html.join("");
}

function messageEl(m) {
  if (m.role === "note") {
    const n = document.createElement("div"); n.className = "note"; n.textContent = m.content; return n;
  }
  const row = document.createElement("div");
  row.className = "msg " + (m.role === "error" ? "bot error" : m.role);
  if (m.role !== "user") { const av = document.createElement("div"); av.className = "avatar"; av.textContent = "AI"; row.append(av); }
  const bubble = document.createElement("div"); bubble.className = "bubble";
  if (m.role === "bot") bubble.innerHTML = renderMarkdown(m.content); else bubble.textContent = m.content;
  if (m.sources?.length) {
    const box = document.createElement("div"); box.className = "sources";
    const label = document.createElement("div"); label.className = "src-label"; label.textContent = "Sources";
    box.append(label);
    for (const s of m.sources) {
      const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = s.file + " ";
      const sc = document.createElement("b"); sc.textContent = s.score.toFixed(2); chip.append(sc); box.append(chip);
    }
    bubble.append(box);
  }
  row.append(bubble); return row;
}

function welcomeEl() {
  const w = document.createElement("div"); w.className = "welcome";
  w.innerHTML = `<div class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    <h2>Ask your documents</h2>
    <p>Attach a .txt, .md or .pdf with the paperclip, then ask anything. I remember what we've said in this chat.</p>
    <div class="suggest"></div>`;
  for (const q of SUGGESTIONS) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = q;
    b.addEventListener("click", () => ask(q)); w.querySelector(".suggest").append(b);
  }
  return w;
}

function renderSidebar() {
  const box = $("sessions"); box.replaceChildren();
  if (!sessions.some(s => s.messages.length)) {
    const e = document.createElement("div"); e.className = "empty-list"; e.textContent = "No chats yet"; box.append(e); return;
  }
  for (const s of [...sessions].sort((a, b) => b.updated - a.updated)) {
    if (!s.messages.length && s.id !== activeId) continue;
    const row = document.createElement("div"); row.className = "session" + (s.id === activeId ? " active" : "");
    const t = document.createElement("button"); t.className = "title"; t.textContent = s.title; t.title = s.title;
    t.addEventListener("click", () => openSession(s.id));
    const d = document.createElement("button"); d.className = "del"; d.setAttribute("aria-label", "Delete chat"); d.textContent = "✕";
    d.addEventListener("click", () => deleteSession(s.id));
    row.append(t, d); box.append(row);
  }
}

function render() {
  if (!active()) newSession();
  const s = active();
  $("topic").textContent = s.title;
  col.replaceChildren();
  if (!s.messages.length) col.append(welcomeEl());
  else for (const m of s.messages) col.append(messageEl(m));
  renderSidebar(); scrollDown();
}
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

/* ---------- actions ---------- */
async function readError(res) {
  try { const d = (await res.json()).detail; return Array.isArray(d) ? d.map(e => e.msg).join("; ") : d; }
  catch { return res.statusText || "Request failed"; }
}
function setBusy(b) { busy = b; send.disabled = b; $("attach").disabled = b; }

function push(session, msg) {
  session.messages.push(msg); session.updated = Date.now();
  if (session.title === "New chat" && msg.role === "user") session.title = msg.content.slice(0, 48);
  save();
}
function append(msg) {
  col.querySelector(".welcome")?.remove(); col.append(messageEl(msg)); scrollDown(); renderSidebar();
  $("topic").textContent = active().title;
}

// The last few real turns (not notes/errors) are what the server uses to resolve "it", "that", etc.
function historyFor(session) {
  return session.messages.filter(m => m.role === "user" || m.role === "bot")
    .map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
}

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  const s = active();
  const history = historyFor(s);               // everything before this question
  const um = { role: "user", content: question };
  push(s, um); append(um);
  input.value = ""; autosize(); setBusy(true);

  const typing = document.createElement("div"); typing.className = "msg bot";
  typing.innerHTML = '<div class="avatar">AI</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  col.append(typing); scrollDown();

  let reply;
  try {
    const res = await fetch("/query", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history }) });
    if (res.ok) { const d = await res.json(); reply = { role: "bot", content: d.answer, sources: d.sources }; }
    else reply = { role: "error", content: await readError(res) };
  } catch { reply = { role: "error", content: "Could not reach the API." }; }
  typing.remove();
  // Keep writing into the chat the question came from, even if the user switched away meanwhile.
  push(s, reply);
  if (s.id === activeId) append(reply); else renderSidebar();
  setBusy(false); input.focus();
}

async function upload(file) {
  if (!file || busy) return;
  const s = active(); setBusy(true);
  const progress = { role: "note", content: `Indexing ${file.name}… (re-embeds all documents, may take a moment)` };
  const el = messageEl(progress); col.querySelector(".welcome")?.remove(); col.append(el); scrollDown();
  const body = new FormData(); body.append("file", file);
  let result;
  try {
    const res = await fetch("/documents", { method: "POST", body });
    result = res.ok ? { role: "note", content: `✓ ${file.name} indexed · ${(await res.json()).chunks_in_collection} chunks in collection` }
                    : { role: "error", content: `Upload failed: ${await readError(res)}` };
  } catch { result = { role: "error", content: "Could not reach the API." }; }
  el.remove(); push(s, result); if (s.id === activeId) append(result);
  fileInput.value = ""; setBusy(false); input.focus();
}

async function checkHealth() {
  try {
    const ok = (await fetch("/health")).ok;
    $("dot").className = "dot " + (ok ? "ok" : "bad"); $("status-text").textContent = ok ? "Connected" : "Database offline";
  } catch { $("dot").className = "dot bad"; $("status-text").textContent = "API unreachable"; }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
const closeSidebar = () => $("app").classList.remove("open");

/* ---------- wiring ---------- */
$("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } });
$("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => upload(fileInput.files[0]));
$("new-chat").addEventListener("click", () => {
  if (busy) return;
  // Reuse an empty chat instead of piling up blank ones.
  const empty = sessions.find(s => !s.messages.length);
  if (empty) activeId = empty.id; else newSession();
  save(); render(); closeSidebar(); input.focus();
});
$("menu").addEventListener("click", () => $("app").classList.add("open"));
$("scrim").addEventListener("click", closeSidebar);

load();
if (!active()) activeId = sessions.find(s => s.messages.length)?.id || null;
render(); checkHealth(); setInterval(checkHealth, 15000); input.focus();
</script>
</body>
</html>

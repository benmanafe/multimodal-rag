<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document Q&amp;A</title>
<style>
  :root {
    --bg:#f3f4f8; --panel:#ffffff; --text:#1b2030; --muted:#6b7385; --border:#e4e7ee;
    --accent:#4f46e5; --accent-2:#7c3aed; --accent-text:#ffffff;
    --user:linear-gradient(135deg,#4f46e5,#7c3aed); --bot:#f0f2f8; --chip:#eef0ff; --chip-text:#4338ca;
    --err-bg:#fff0f0; --err:#c0392b; --shadow:0 10px 40px rgba(30,35,60,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1017; --panel:#171a24; --text:#e8eaf2; --muted:#8f97ab; --border:#272c3a;
      --accent:#818cf8; --accent-2:#a78bfa; --accent-text:#10121a;
      --user:linear-gradient(135deg,#6366f1,#8b5cf6); --bot:#20243a; --chip:#262b4a; --chip-text:#b4bbff;
      --err-bg:#2c1a1d; --err:#ff8f8f; --shadow:0 10px 40px rgba(0,0,0,.45);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; justify-content:center; }
  .app { width:100%; max-width:820px; height:100dvh; display:flex; flex-direction:column; background:var(--panel); }
  @media (min-width:860px) { body { padding:24px; } .app { height:calc(100dvh - 48px); border-radius:20px; box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; } }

  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .logo { width:38px; height:38px; border-radius:11px; background:var(--user); display:grid; place-items:center; color:#fff; flex:none; }
  .titles { flex:1; min-width:0; }
  h1 { margin:0; font-size:1.02rem; font-weight:650; }
  .status { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:#9aa1b2; }
  .dot.ok { background:#22c55e; } .dot.bad { background:#ef4444; }
  header a { color:var(--muted); font-size:.82rem; text-decoration:none; padding:6px 10px; border-radius:8px; }
  header a:hover { background:var(--bot); color:var(--text); }

  #chat { flex:1; overflow-y:auto; padding:22px 18px 10px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
  .msg { display:flex; gap:10px; max-width:88%; animation:in .22s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .avatar { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:.72rem; font-weight:700; background:var(--bot); color:var(--accent); }
  .msg.user .avatar { display:none; }
  .bubble { padding:10px 14px; border-radius:16px; word-wrap:break-word; overflow-wrap:anywhere; }
  .msg.bot .bubble { background:var(--bot); border-top-left-radius:4px; }
  .msg.user .bubble { background:var(--user); color:#fff; border-top-right-radius:4px; white-space:pre-wrap; }
  .msg.error .bubble { background:var(--err-bg); color:var(--err); }
  .bubble p { margin:0 0 .6em; } .bubble p:last-child { margin-bottom:0; }
  .bubble ul, .bubble ol { margin:.3em 0 .6em; padding-left:1.3em; }
  .bubble code { background:rgba(127,127,160,.2); padding:1px 5px; border-radius:5px; font-size:.9em; }

  .note { align-self:center; font-size:.8rem; color:var(--muted); background:var(--bot); padding:5px 12px; border-radius:999px; }

  .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:.76rem; background:var(--chip); color:var(--chip-text); padding:3px 10px; border-radius:999px; }
  .chip b { font-weight:600; opacity:.75; }
  .src-label { width:100%; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }

  .typing { display:flex; gap:4px; padding:6px 2px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:b 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes b { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-5px); opacity:1; } }

  .welcome { margin:auto; text-align:center; padding:20px; max-width:460px; }
  .welcome .logo { margin:0 auto 14px; width:56px; height:56px; border-radius:16px; }
  .welcome h2 { margin:0 0 6px; font-size:1.25rem; }
  .welcome p { margin:0 0 18px; color:var(--muted); }
  .suggest { display:flex; flex-direction:column; gap:8px; }
  .suggest button { text-align:left; padding:10px 14px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; font:inherit; cursor:pointer; transition:.15s; }
  .suggest button:hover { border-color:var(--accent); transform:translateY(-1px); }

  form { display:flex; align-items:flex-end; gap:8px; padding:12px 14px 14px; border-top:1px solid var(--border); }
  .field { flex:1; display:flex; align-items:flex-end; gap:4px; background:var(--bot); border:1px solid transparent; border-radius:16px; padding:4px 6px 4px 4px; }
  .field:focus-within { border-color:var(--accent); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:inherit; padding:9px 6px; max-height:140px; }
  textarea::placeholder { color:var(--muted); }
  .icon-btn, .send { border:0; cursor:pointer; display:grid; place-items:center; flex:none; font:inherit; }
  .icon-btn { width:36px; height:36px; border-radius:10px; background:transparent; color:var(--muted); }
  .icon-btn:hover { background:var(--border); color:var(--text); }
  .send { width:42px; height:42px; border-radius:14px; background:var(--user); color:#fff; transition:.15s; }
  .send:hover:not(:disabled) { transform:scale(1.05); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hint { text-align:center; font-size:.72rem; color:var(--muted); padding:0 14px 10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
    </div>
    <div class="titles">
      <h1>RAG Document Q&amp;A</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status-text">Checking…</span></div>
    </div>
    <a href="/docs" target="_blank" rel="noopener">API docs</a>
  </header>

  <div id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h2>Ask your documents</h2>
      <p>Attach a .txt, .md or .pdf with the paperclip, then ask anything about it. Answers come with their sources.</p>
      <div class="suggest">
        <button type="button">What is retrieval-augmented generation?</button>
        <button type="button">Why does chunk size matter?</button>
        <button type="button">Summarize the documents I've uploaded</button>
      </div>
    </div>
  </div>

  <form id="form">
    <input type="file" id="file" accept=".txt,.md,.pdf" hidden>
    <div class="field">
      <button type="button" class="icon-btn" id="attach" title="Attach a document" aria-label="Attach a document">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask a question about your documents…" aria-label="Message"></textarea>
    </div>
    <button type="submit" class="send" id="send" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-8-4 16-3-7z"/></svg>
    </button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line · each question is answered independently</div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), fileInput = $("file");
let busy = false;

/* ---------- helpers ---------- */
// FastAPI returns {detail: "text"} or, for validation errors, {detail: [{msg}]}.
async function readError(res) {
  try {
    const d = (await res.json()).detail;
    return Array.isArray(d) ? d.map(e => e.msg).join("; ") : d;
  } catch { return res.statusText || "Request failed"; }
}

// Tiny safe markdown: escape first, then bold, inline code, lists, paragraphs.
function renderMarkdown(text) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const html = []; let list = null;
  const close = () => { if (list) { html.push(`</${list}>`); list = null; } };
  for (const line of text.split("\n")) {
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { close(); html.push(`<${tag}>`); list = tag; }
      html.push(`<li>${inline((ul || ol)[1])}</li>`);
    } else if (line.trim()) { close(); html.push(`<p>${inline(line)}</p>`); }
    else close();
  }
  close(); return html.join("");
}

function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function hideWelcome() { const w = $("welcome"); if (w) w.remove(); }

function addMessage(role, content, { html = false, sources = [] } = {}) {
  hideWelcome();
  const row = document.createElement("div");
  row.className = `msg ${role === "error" ? "bot error" : role}`;
  if (role !== "user") {
    const av = document.createElement("div"); av.className = "avatar"; av.textContent = "AI"; row.append(av);
  }
  const bubble = document.createElement("div"); bubble.className = "bubble";
  if (html) bubble.innerHTML = content; else bubble.textContent = content;
  if (sources.length) {
    const box = document.createElement("div"); box.className = "sources";
    const label = document.createElement("div"); label.className = "src-label"; label.textContent = "Sources";
    box.append(label);
    for (const s of sources) {
      const chip = document.createElement("span"); chip.className = "chip";
      chip.textContent = s.file + " ";
      const score = document.createElement("b"); score.textContent = s.score.toFixed(2);
      chip.append(score); box.append(chip);
    }
    bubble.append(box);
  }
  row.append(bubble); chat.append(row); scrollDown(); return row;
}

function addNote(text) {
  hideWelcome();
  const n = document.createElement("div"); n.className = "note"; n.textContent = text;
  chat.append(n); scrollDown(); return n;
}

function addTyping() {
  hideWelcome();
  const row = document.createElement("div"); row.className = "msg bot";
  row.innerHTML = '<div class="avatar">AI</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  chat.append(row); scrollDown(); return row;
}

function setBusy(b) { busy = b; send.disabled = b; $("attach").disabled = b; }

/* ---------- actions ---------- */
async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  addMessage("user", question);
  input.value = ""; autosize(); setBusy(true);
  const typing = addTyping();
  try {
    const res = await fetch("/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    typing.remove();
    if (res.ok) {
      const data = await res.json();
      addMessage("bot", renderMarkdown(data.answer), { html: true, sources: data.sources });
    } else addMessage("error", await readError(res));
  } catch { typing.remove(); addMessage("error", "Could not reach the API."); }
  setBusy(false); input.focus();
}

async function upload(file) {
  if (!file || busy) return;
  setBusy(true);
  const note = addNote(`Indexing ${file.name}… (re-embeds all documents, may take a moment)`);
  const body = new FormData(); body.append("file", file);
  try {
    const res = await fetch("/documents", { method: "POST", body });
    note.remove();
    if (res.ok) addNote(`✓ ${file.name} indexed · ${(await res.json()).chunks_in_collection} chunks in collection`);
    else addMessage("error", `Upload failed: ${await readError(res)}`);
  } catch { note.remove(); addMessage("error", "Could not reach the API."); }
  fileInput.value = ""; setBusy(false); input.focus();
}

async function checkHealth() {
  try {
    const res = await fetch("/health");
    const ok = res.ok;
    $("dot").className = "dot " + (ok ? "ok" : "bad");
    $("status-text").textContent = ok ? "Connected" : "Vector database offline";
  } catch { $("dot").className = "dot bad"; $("status-text").textContent = "API unreachable"; }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }

/* ---------- wiring ---------- */
$("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
});
$("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => upload(fileInput.files[0]));
document.querySelectorAll(".suggest button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));

checkHealth(); setInterval(checkHealth, 15000); input.focus();
</script>
</body>
</html>

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2   # pinned so upgrades are deliberate
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage   # named volume: data survives container restarts
    restart: unless-stopped

volumes:
  qdrant_data:
